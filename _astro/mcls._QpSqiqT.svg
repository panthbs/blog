<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 176" width="640" height="176" role="img" aria-label="MCLS: at inference a CLS token is inserted every 256 tokens of a long document and the final hidden states of all CLS tokens are averaged into one embedding, without fine-tuning">
<style>
.ink{fill:#2A3140}.mut{fill:#6B7484}.ln{stroke:#8A93A3;fill:none;stroke-width:1.2}.lnf{fill:#8A93A3}.bx{fill:#FFFFFF;stroke:#8A93A3;stroke-width:1.2}
.dn{stroke:#2F6FB0;stroke-width:1.4}.dnf{fill:#2F6FB0}.dnt{fill:#2F6FB0;fill-opacity:.13}
.sp{stroke:#B7791F;stroke-width:1.4}.spf{fill:#B7791F}.spt{fill:#B7791F;fill-opacity:.13}
.mv{stroke:#22876A;stroke-width:1.4}.mvf{fill:#22876A}.mvt{fill:#22876A;fill-opacity:.13}
.tc{stroke:#7A4E9C;stroke-width:1.4}.tcf{fill:#7A4E9C}.tct{fill:#7A4E9C;fill-opacity:.13}
text{font-family:'Noto Sans Thai Variable','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px}
.b{font-weight:600}.s{font-size:11px}.xs{font-size:10px}
.m,.ms{font-family:"Latin Modern Roman","LM Roman 10","TeX Gyre Termes","STIX Two Text","Nimbus Roman","Liberation Serif","Times New Roman",Times,serif;font-style:italic}.m{font-size:13.5px}.ms{font-size:12px}
.mi,.mn{font-family:"Latin Modern Roman","LM Roman 10","TeX Gyre Termes","STIX Two Text","Nimbus Roman","Liberation Serif","Times New Roman",Times,serif;font-size:1.06em}.mi{font-style:italic}.mn{font-style:normal}
.up{font-style:normal}.sb{font-size:.72em}.bb{font-style:normal;font-weight:700}.nb{font-weight:400}
@media (prefers-color-scheme: dark){.ink{fill:#E6E9EF}.mut{fill:#9AA3B2}.ln{stroke:#7C8797}.lnf{fill:#7C8797}.bx{fill:#1C212B;stroke:#7C8797}.dn{stroke:#6FA6E0}.dnf{fill:#6FA6E0}.sp{stroke:#E0A94A}.spf{fill:#E0A94A}.mv{stroke:#58BF9C}.mvf{fill:#58BF9C}.tc{stroke:#B48BD6}.tcf{fill:#B48BD6}}
</style>
<defs><marker id="mc-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="lnf"/></marker></defs>
<text x="320" y="16" text-anchor="middle" class="mut">MCLS at inference, no long-document fine-tuning (&#167;3.4, App. B.2)</text>
<rect x="20" y="30" width="600" height="28" class="bx"/>
<rect x="20" y="30" width="36" height="28" class="tct tc"/><text x="38" y="48" text-anchor="middle" class="ink xs">[CLS]</text>
<text x="105" y="48" text-anchor="middle" class="mut s">256 tokens</text>
<rect x="170" y="30" width="36" height="28" class="tct tc"/><text x="188" y="48" text-anchor="middle" class="ink xs">[CLS]</text>
<text x="255" y="48" text-anchor="middle" class="mut s">256 tokens</text>
<rect x="320" y="30" width="36" height="28" class="tct tc"/><text x="338" y="48" text-anchor="middle" class="ink xs">[CLS]</text>
<text x="405" y="48" text-anchor="middle" class="mut s">256 tokens</text>
<rect x="470" y="30" width="36" height="28" class="tct tc"/><text x="488" y="48" text-anchor="middle" class="ink xs">[CLS]</text>
<text x="563" y="48" text-anchor="middle" class="mut s">&#8230; up to 8192</text>
<path d="M38,58 L38,84 L320,84 L320,104" class="ln tc" marker-end="url(#mc-a)"/>
<path d="M188,58 L188,84" class="ln tc"/>
<path d="M338,58 L338,84" class="ln tc"/>
<path d="M488,58 L488,84 L320,84" class="ln tc"/>
<text x="330" y="99" class="mut s">encoder &#8594; last hidden state of every [CLS]</text>
<rect x="175" y="106" width="290" height="34" rx="3" class="bx"/>
<text x="320" y="127" text-anchor="middle" class="ink s">average of all [CLS] states = document embedding</text>
<text x="320" y="164" text-anchor="middle" class="mut xs">Table 3 (MLDR nDCG@10, avg): Dense-w.o.long 41.2 &#8594; 45.0 with MCLS</text>
