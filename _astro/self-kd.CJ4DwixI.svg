<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" width="640" height="368" role="img" aria-label="Self-knowledge distillation: the three heads' scores are summed with weights into s_inter, whose softmax is the teacher for each head's soft-label loss; final loss averages the plain InfoNCE losses and the distilled ones">
<style>
.ink{fill:#2A3140}.mut{fill:#6B7484}.ln{stroke:#8A93A3;fill:none;stroke-width:1.2}.lnf{fill:#8A93A3}.bx{fill:#FFFFFF;stroke:#8A93A3;stroke-width:1.2}
.dn{stroke:#2F6FB0;stroke-width:1.4}.dnf{fill:#2F6FB0}.dnt{fill:#2F6FB0;fill-opacity:.13}
.sp{stroke:#B7791F;stroke-width:1.4}.spf{fill:#B7791F}.spt{fill:#B7791F;fill-opacity:.13}
.mv{stroke:#22876A;stroke-width:1.4}.mvf{fill:#22876A}.mvt{fill:#22876A;fill-opacity:.13}
.tc{stroke:#7A4E9C;stroke-width:1.4}.tcf{fill:#7A4E9C}.tct{fill:#7A4E9C;fill-opacity:.13}
text{font-family:'Noto Sans Thai Variable','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px}
.b{font-weight:600}.s{font-size:11px}.xs{font-size:10px}
.m,.ms{font-family:"Latin Modern Roman","LM Roman 10","TeX Gyre Termes","STIX Two Text","Nimbus Roman","Liberation Serif","Times New Roman",Times,serif;font-style:italic}.m{font-size:13.5px}.ms{font-size:11.5px}
.mi,.mn{font-family:"Latin Modern Roman","LM Roman 10","TeX Gyre Termes","STIX Two Text","Nimbus Roman","Liberation Serif","Times New Roman",Times,serif;font-size:1.06em}.mi{font-style:italic}.mn{font-style:normal}
.up{font-style:normal}.sb{font-size:.72em}.bb{font-style:normal;font-weight:700}.nb{font-weight:400}
@media (prefers-color-scheme: dark){.ink{fill:#E6E9EF}.mut{fill:#9AA3B2}.ln{stroke:#7C8797}.lnf{fill:#7C8797}.bx{fill:#1C212B;stroke:#7C8797}.dn{stroke:#6FA6E0}.dnf{fill:#6FA6E0}.sp{stroke:#E0A94A}.spf{fill:#E0A94A}.mv{stroke:#58BF9C}.mvf{fill:#58BF9C}.tc{stroke:#B48BD6}.tcf{fill:#B48BD6}}
</style>
<defs><marker id="skd-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="lnf"/></marker></defs>
<rect x="40" y="18" width="160" height="36" rx="3" class="bx dn dnt"/><text x="120" y="42" text-anchor="middle" class="ink m">s<tspan class="sb" dy="3">dense</tspan><tspan class="up" dy="-3">(</tspan>q<tspan class="up">, </tspan>p<tspan class="up">)</tspan></text>
<rect x="240" y="18" width="160" height="36" rx="3" class="bx sp spt"/><text x="320" y="42" text-anchor="middle" class="ink m">s<tspan class="sb" dy="3">lex</tspan><tspan class="up" dy="-3">(</tspan>q<tspan class="up">, </tspan>p<tspan class="up">)</tspan></text>
<rect x="440" y="18" width="160" height="36" rx="3" class="bx mv mvt"/><text x="520" y="42" text-anchor="middle" class="ink m">s<tspan class="sb" dy="3">mul</tspan><tspan class="up" dy="-3">(</tspan>q<tspan class="up">, </tspan>p<tspan class="up">)</tspan></text>
<text x="120" y="70" text-anchor="middle" class="mut s">InfoNCE &#8594; <tspan class="mi">L</tspan><tspan class="mi sb" dy="2">dense</tspan><tspan dy="-2">  (Eq. 2)</tspan></text>
<text x="320" y="70" text-anchor="middle" class="mut s">InfoNCE &#8594; <tspan class="mi">L</tspan><tspan class="mi sb" dy="2">lex</tspan></text>
<text x="520" y="70" text-anchor="middle" class="mut s">InfoNCE &#8594; <tspan class="mi">L</tspan><tspan class="mi sb" dy="2">mul</tspan></text>
<path d="M120,76 L120,96 L240,96 L240,118" class="ln dn" marker-end="url(#skd-a)"/>
<text x="176" y="92" text-anchor="middle" class="ink b ms"><tspan class="up">&#215; </tspan>w<tspan class="sb up" dy="2">1</tspan><tspan class="up" dy="-2"> = 1</tspan></text>
<line x1="320" y1="76" x2="320" y2="118" class="ln sp" marker-end="url(#skd-a)"/>
<text x="354" y="100" text-anchor="middle" class="ink b ms"><tspan class="up">&#215; </tspan>w<tspan class="sb up" dy="2">2</tspan><tspan class="up" dy="-2"> = 0.3</tspan></text>
<path d="M520,76 L520,96 L400,96 L400,118" class="ln mv" marker-end="url(#skd-a)"/>
<text x="464" y="92" text-anchor="middle" class="ink b ms"><tspan class="up">&#215; </tspan>w<tspan class="sb up" dy="2">3</tspan><tspan class="up" dy="-2"> = 1</tspan></text>
<rect x="150" y="120" width="340" height="50" rx="3" class="bx tc tct"/>
<text x="320" y="142" text-anchor="middle" class="ink m b">s<tspan class="sb" dy="3">inter</tspan><tspan class="up" dy="-3"> = </tspan>w<tspan class="sb up" dy="3">1</tspan><tspan class="up" dy="-3">&#183;</tspan>s<tspan class="sb" dy="3">dense</tspan><tspan class="up" dy="-3"> + </tspan>w<tspan class="sb up" dy="3">2</tspan><tspan class="up" dy="-3">&#183;</tspan>s<tspan class="sb" dy="3">lex</tspan><tspan class="up" dy="-3"> + </tspan>w<tspan class="sb up" dy="3">3</tspan><tspan class="up" dy="-3">&#183;</tspan>s<tspan class="sb" dy="3">mul</tspan><tspan class="up mut nb" dy="-3">  (Eq. 3)</tspan></text>
<text x="320" y="160" text-anchor="middle" class="mut s">teacher = the model&#8217;s own ensemble; also trained as <tspan class="mi">L</tspan><tspan class="mi sb" dy="2">inter</tspan></text>
<path d="M240,170 L240,180 L120,180 L120,208" class="ln tc" marker-end="url(#skd-a)"/>
<path d="M400,170 L400,180 L520,180 L520,208" class="ln tc" marker-end="url(#skd-a)"/>
<line x1="320" y1="170" x2="320" y2="208" class="ln tc" marker-end="url(#skd-a)"/>
<text x="330" y="199" class="mut s">softmax over {<tspan class="mi">p</tspan><tspan class="sb up" dy="-3">*</tspan><tspan dy="3">, </tspan><tspan class="mi">P</tspan><tspan class="sb up" dy="-3">&#8242;</tspan><tspan dy="3">} &#8594; </tspan><tspan class="mi">p</tspan>(<tspan class="mi">s</tspan><tspan class="mi sb" dy="2">inter</tspan><tspan dy="-2">), the soft label</tspan></text>
<rect x="30" y="210" width="180" height="40" rx="3" class="bx dn"/>
<text x="120" y="235" text-anchor="middle" class="ink ms">L<tspan class="sb up" dy="-4">&#8242;</tspan><tspan class="sb" dy="7">dense</tspan><tspan class="up" dy="-3"> = &#8722;</tspan>p<tspan class="up">(</tspan>s<tspan class="sb" dy="3">inter</tspan><tspan class="up" dy="-3">) log </tspan>p<tspan class="up">(</tspan>s<tspan class="sb" dy="3">dense</tspan><tspan class="up" dy="-3">)</tspan></text>
<rect x="230" y="210" width="180" height="40" rx="3" class="bx sp"/>
<text x="320" y="235" text-anchor="middle" class="ink ms">L<tspan class="sb up" dy="-4">&#8242;</tspan><tspan class="sb" dy="7">lex</tspan><tspan class="up" dy="-3"> = &#8722;</tspan>p<tspan class="up">(</tspan>s<tspan class="sb" dy="3">inter</tspan><tspan class="up" dy="-3">) log </tspan>p<tspan class="up">(</tspan>s<tspan class="sb" dy="3">lex</tspan><tspan class="up" dy="-3">)</tspan></text>
<rect x="430" y="210" width="180" height="40" rx="3" class="bx mv"/>
<text x="520" y="235" text-anchor="middle" class="ink ms">L<tspan class="sb up" dy="-4">&#8242;</tspan><tspan class="sb" dy="7">mul</tspan><tspan class="up" dy="-3"> = &#8722;</tspan>p<tspan class="up">(</tspan>s<tspan class="sb" dy="3">inter</tspan><tspan class="up" dy="-3">) log </tspan>p<tspan class="up">(</tspan>s<tspan class="sb" dy="3">mul</tspan><tspan class="up" dy="-3">)</tspan></text>
<text x="320" y="264" text-anchor="middle" class="mut xs">(Eq. 5)</text>
<line x1="20" y1="276" x2="620" y2="276" class="ln" stroke-dasharray="3 3"/>
<text x="320" y="297" text-anchor="middle" class="ink m">L<tspan class="up"> = (</tspan>&#955;<tspan class="sb up" dy="3">1</tspan><tspan dy="-3">L</tspan><tspan class="sb" dy="3">dense</tspan><tspan class="up" dy="-3"> + </tspan>&#955;<tspan class="sb up" dy="3">2</tspan><tspan dy="-3">L</tspan><tspan class="sb" dy="3">lex</tspan><tspan class="up" dy="-3"> + </tspan>&#955;<tspan class="sb up" dy="3">3</tspan><tspan dy="-3">L</tspan><tspan class="sb" dy="3">mul</tspan><tspan class="up" dy="-3"> + </tspan>L<tspan class="sb" dy="3">inter</tspan><tspan class="up" dy="-3">) / 4</tspan><tspan class="up mut nb">  (Eq. 4)</tspan></text>
<text x="320" y="319" text-anchor="middle" class="ink m">L<tspan class="sb up" dy="-4">&#8242;</tspan><tspan class="up" dy="4"> = (</tspan>&#955;<tspan class="sb up" dy="3">1</tspan><tspan dy="-3">L</tspan><tspan class="sb up" dy="-4">&#8242;</tspan><tspan class="sb" dy="7">dense</tspan><tspan class="up" dy="-3"> + </tspan>&#955;<tspan class="sb up" dy="3">2</tspan><tspan dy="-3">L</tspan><tspan class="sb up" dy="-4">&#8242;</tspan><tspan class="sb" dy="7">lex</tspan><tspan class="up" dy="-3"> + </tspan>&#955;<tspan class="sb up" dy="3">3</tspan><tspan dy="-3">L</tspan><tspan class="sb up" dy="-4">&#8242;</tspan><tspan class="sb" dy="7">mul</tspan><tspan class="up" dy="-3">) / 3</tspan><tspan class="up mut nb">  (Eq. 6)</tspan></text>
<text x="320" y="343" text-anchor="middle" class="ink m b">L<tspan class="sb" dy="3">final</tspan><tspan class="up" dy="-3"> = (</tspan>L<tspan class="up"> + </tspan>L<tspan class="sb up" dy="-4">&#8242;</tspan><tspan class="up" dy="4">) / 2</tspan></text>
<text x="320" y="362" text-anchor="middle" class="mut xs">training weights (p. 5): <tspan class="mi">w</tspan><tspan class="mn"> = (1, 0.3, 1)</tspan>, <tspan class="mi">&#955;</tspan><tspan class="mn"> = (1, 0.1, 1)</tspan> &#8212; small <tspan class="mi">&#955;</tspan><tspan class="mn sb" dy="2">2</tspan><tspan dy="-2"> because </tspan><tspan class="mi">W</tspan><tspan class="mi sb" dy="2">lex</tspan><tspan dy="-2"> starts random and </tspan><tspan class="mi">L</tspan><tspan class="mi sb" dy="2">lex</tspan><tspan dy="-2"> is large early</tspan></text>
</svg>
