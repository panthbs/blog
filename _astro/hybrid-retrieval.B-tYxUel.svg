<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" width="640" height="256" role="img" aria-label="Hybrid retrieval at inference: dense and sparse indexes each return candidates, the union is re-ranked with the weighted sum of dense, sparse and multi-vector scores">
<style>
.ink{fill:#2A3140}.mut{fill:#6B7484}.ln{stroke:#8A93A3;fill:none;stroke-width:1.2}.lnf{fill:#8A93A3}.bx{fill:#FFFFFF;stroke:#8A93A3;stroke-width:1.2}
.dn{stroke:#2F6FB0;stroke-width:1.4}.dnf{fill:#2F6FB0}.dnt{fill:#2F6FB0;fill-opacity:.13}
.sp{stroke:#B7791F;stroke-width:1.4}.spf{fill:#B7791F}.spt{fill:#B7791F;fill-opacity:.13}
.mv{stroke:#22876A;stroke-width:1.4}.mvf{fill:#22876A}.mvt{fill:#22876A;fill-opacity:.13}
.tc{stroke:#7A4E9C;stroke-width:1.4}.tcf{fill:#7A4E9C}.tct{fill:#7A4E9C;fill-opacity:.13}
text{font-family:'Noto Sans Thai Variable','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px}
.b{font-weight:600}.s{font-size:11px}.xs{font-size:10px}
.m,.ms{font-family:"Latin Modern Roman","LM Roman 10","TeX Gyre Termes","STIX Two Text","Nimbus Roman","Liberation Serif","Times New Roman",Times,serif;font-style:italic}.m{font-size:13.5px}.ms{font-size:12px}
.mi,.mn{font-family:"Latin Modern Roman","LM Roman 10","TeX Gyre Termes","STIX Two Text","Nimbus Roman","Liberation Serif","Times New Roman",Times,serif;font-size:1.06em}.mi{font-style:italic}.mn{font-style:normal}
.up{font-style:normal}.sb{font-size:.72em}.bb{font-style:normal;font-weight:700}.nb{font-weight:400}
@media (prefers-color-scheme: dark){.ink{fill:#E6E9EF}.mut{fill:#9AA3B2}.ln{stroke:#7C8797}.lnf{fill:#7C8797}.bx{fill:#1C212B;stroke:#7C8797}.dn{stroke:#6FA6E0}.dnf{fill:#6FA6E0}.sp{stroke:#E0A94A}.spf{fill:#E0A94A}.mv{stroke:#58BF9C}.mvf{fill:#58BF9C}.tc{stroke:#B48BD6}.tcf{fill:#B48BD6}}
</style>
<defs><marker id="hr-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="lnf"/></marker></defs>
<text x="320" y="16" text-anchor="middle" class="mut">hybrid retrieval at inference (&#167;3.2 Eq. 1, &#167;4.1 p. 6, &#167;4.3 p. 8)</text>
<rect x="20" y="104" width="90" height="40" rx="3" class="bx"/><text x="65" y="129" text-anchor="middle" class="ink b">query <tspan class="m">q</tspan></text>
<path d="M110,124 L128,124 L128,64 L148,64" class="ln dn" marker-end="url(#hr-a)"/>
<path d="M110,124 L128,124 L128,184 L148,184" class="ln sp" marker-end="url(#hr-a)"/>
<rect x="150" y="42" width="190" height="44" rx="3" class="bx dn dnt"/>
<text x="245" y="61" text-anchor="middle" class="ink b">dense index (Faiss)</text>
<text x="245" y="78" text-anchor="middle" class="mut s">top-1000 by <tspan class="mi">s</tspan><tspan class="mi sb" dy="2">dense</tspan></text>
<rect x="150" y="162" width="190" height="44" rx="3" class="bx sp spt"/>
<text x="245" y="181" text-anchor="middle" class="ink b">sparse index (Lucene)</text>
<text x="245" y="198" text-anchor="middle" class="mut s">top-1000 by <tspan class="mi">s</tspan><tspan class="mi sb" dy="2">lex</tspan></text>
<path d="M340,64 L360,64 L360,124 L378,124" class="ln dn" marker-end="url(#hr-a)"/>
<path d="M340,184 L360,184 L360,124" class="ln sp"/>
<rect x="380" y="104" width="90" height="40" rx="3" class="bx"/>
<text x="425" y="121" text-anchor="middle" class="ink">union of</text><text x="425" y="136" text-anchor="middle" class="ink">candidates</text>
<line x1="470" y1="124" x2="486" y2="124" class="ln" marker-end="url(#hr-a)"/>
<rect x="488" y="86" width="132" height="76" rx="3" class="bx mv mvt"/>
<text x="554" y="105" text-anchor="middle" class="ink b">re-rank by <tspan class="mi">s</tspan><tspan class="mi sb" dy="2">rank</tspan></text>
<text x="554" y="123" text-anchor="middle" class="ink ms">w<tspan class="sb up" dy="3">1</tspan><tspan class="up" dy="-3">&#183;</tspan>s<tspan class="sb" dy="3">dense</tspan><tspan class="up" dy="-3"> + </tspan>w<tspan class="sb up" dy="3">2</tspan><tspan class="up" dy="-3">&#183;</tspan>s<tspan class="sb" dy="3">lex</tspan></text>
<text x="554" y="139" text-anchor="middle" class="ink ms"><tspan class="up">+ </tspan>w<tspan class="sb up" dy="3">3</tspan><tspan class="up" dy="-3">&#183;</tspan>s<tspan class="sb" dy="3">mul</tspan></text>
<text x="554" y="155" text-anchor="middle" class="mut xs"><tspan class="mi">s</tspan><tspan class="mi sb" dy="2">mul</tspan><tspan dy="-2"> computed only here</tspan></text>
<line x1="20" y1="218" x2="620" y2="218" class="ln" stroke-dasharray="3 3"/>
<text x="320" y="233" text-anchor="middle" class="mut s">MIRACL (p. 6): Dense+Sparse <tspan class="mi">w</tspan><tspan class="mn"> = (1, 0.3, 0)</tspan> on the union; All <tspan class="mi">w</tspan><tspan class="mn"> = (1, 0.3, 1)</tspan> re-ranking top-200 from Dense</text>
<text x="320" y="248" text-anchor="middle" class="mut s">MLDR (p. 8): Dense+Sparse <tspan class="mi">w</tspan><tspan class="mn"> = (0.2, 0.8, 0)</tspan>; All <tspan class="mi">w</tspan><tspan class="mn"> = (0.15, 0.5, 0.35)</tspan> &#8212; more weight on sparse for long documents</text>
</svg>
